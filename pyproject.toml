[project]
name = "hacs-heating_system"
version = "0.17.0"
description = "Home Assistant custom integration for hydronic central heating"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0911", # config flow steps return from several branches
    "PLR0912",
    "PLR0915",
    "PLR0913",
    "PLR2004", # magic values are fine in tests and validators
    "RUF001",  # Czech text in strings
    "RUF012",  # Home Assistant entities use list class attributes
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
